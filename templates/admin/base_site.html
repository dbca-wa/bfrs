{% block extrabody %}
<script>
    /* GoKart section */
    gokart = Gokart.get('bfrs','{% settings_value "SSS_URL" %}');

    function openGokart(open_options) {
        gokart.call("open", open_options);
    }

    {% refresh_gokart %}

   /* END - GoKart section */

    function growl(response) {
        var toastContainer = document.getElementById('bfrs-toast-container');
        if (!toastContainer) {
            toastContainer = document.createElement('div');
            toastContainer.id = 'bfrs-toast-container';
            toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
            toastContainer.style.zIndex = '1100';
            document.body.appendChild(toastContainer);
        }
        var typeClass = {
            'success': 'text-bg-success',
            'danger':  'text-bg-danger',
            'warning': 'text-bg-warning',
            'info':    'text-bg-info'
        }[response.type] || 'text-bg-secondary';
        var toastEl = document.createElement('div');
        toastEl.className = 'toast align-items-center ' + typeClass + ' border-0';
        toastEl.setAttribute('role', 'alert');
        toastEl.setAttribute('aria-live', 'assertive');
        toastEl.setAttribute('aria-atomic', 'true');
        toastEl.innerHTML = '<div class="d-flex"><div class="toast-body">' + response.message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>';
        toastContainer.appendChild(toastEl);
        var toast = new bootstrap.Toast(toastEl, { delay: 10000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', function () { toastEl.remove(); });
    };

</script>

{% endblock %}
