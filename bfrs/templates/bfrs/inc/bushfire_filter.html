<div id="accordion" style="margin-bottom:10px">
  <div id="filter" class="collapse show">
    <form id="bushfire_filter" action="" method="get">
      <div class="d-flex flex-wrap align-items-end gap-3 p-3 rounded-1" style="background-color:#f5f0e1;">

        <div id="div_id_region">
          <label class="form-label mb-1 d-block" for="{{ filter.form.region.id_for_label }}">Region</label>
          {{ form.region }}
        </div>

        <div id="div_id_district">
          <label class="form-label mb-1 d-block" for="{{ filter.form.district.id_for_label }}">District</label>
          {{ form.district }}
        </div>

        <div id="div_id_year">
          <label class="form-label mb-1 d-block" for="{{ filter.form.year.id_for_label }}">Year</label>
          {{ form.year }}
        </div>

        {% if can_maintain_data %}
        <div id="div_id_reporting_year">
          <label class="form-label mb-1 d-block" for="{{ filter.form.reporting_year.id_for_label }}">Reporting Year</label>
          {{ form.reporting_year }}
        </div>
        {% endif %}

        <div id="div_id_report_status">
          <label class="form-label mb-1 d-block" for="{{ filter.form.report_status.id_for_label }}">Report Status</label>
          {{ form.report_status }}
        </div>

        <div id="div_id_archive">
          <label class="form-label mb-1 d-block">&nbsp;</label>
          <div class="d-flex align-items-center gap-1">
            {{ form.include_archived }}
            <label class="form-label mb-0" for="{{ filter.form.archive.id_for_archive }}">Include archived</label>
          </div>
          {% if can_maintain_data %}
          <div class="d-flex align-items-center gap-1 mt-1">
            {{ form.exclude_missing_final_fire_boundary }}
            <label class="form-label mb-0">Exclude missing fire boundary</label>
          </div>
          {% endif %}
        </div>

        <div class="ms-auto">
          <button type="submit" class="btn btn-light btn-sm border btn-admin-link"><i class="bi bi-arrow-clockwise"></i> Update</button>
        </div>

      </div>
    </form>
  </div>
</div>


<script>

</script>
